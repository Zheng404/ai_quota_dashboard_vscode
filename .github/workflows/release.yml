name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  vscode:
    name: VSCode Extension Release
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: vscode

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: vscode/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Extract version from tag
        id: get_version
        run: |
          TAG=${{ github.ref_name }}
          VERSION=${TAG#v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Update package.json version
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          CURRENT=$(node -p "require('./package.json').version")
          if [ "$VERSION" = "$CURRENT" ]; then
            echo "package.json already at version $VERSION, skipping npm version"
          else
            npm version "$VERSION" --git-tag-version=false
            echo "Updated package.json to version: $VERSION"
          fi

      - name: Commit version changes
        run: |
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No version changes to commit"
          else
            git commit -m "chore: bump version to ${{ steps.get_version.outputs.VERSION }}"
          fi

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Compile extension
        run: npm run compile

      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          awk -v ver="[$VERSION]" '
            $0 ~ "^## " ver { capture=1; next }
            capture && $0 ~ "^## \[" { exit }
            capture { print }
          ' CHANGELOG.md > .github-release-notes.md

          if [ ! -s .github-release-notes.md ]; then
            echo "No release notes found for version $VERSION in CHANGELOG.md"
            echo "Release $VERSION" > .github-release-notes.md
          fi

          echo "--- Release Notes ---"
          cat .github-release-notes.md
          echo "---"

      - name: Package VSIX
        run: vsce package
        continue-on-error: false

      - name: Get VSIX filename
        id: get_filename
        run: |
          VSIX_FILE=$(ls *.vsix)
          echo "VSIX_FILE=$VSIX_FILE" >> $GITHUB_OUTPUT
          echo "VSIX filename: $VSIX_FILE"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-extension-release
          path: vscode/${{ steps.get_filename.outputs.VSIX_FILE }}
          retention-days: 90

      - name: Publish to VSCode Marketplace
        if: env.SKIP_PUBLISH != 'true'
        run: vsce publish -p ${{ secrets.VSCE_PAT }}
        env:
          SKIP_PUBLISH: ${{ secrets.VSCE_PAT == '' && 'true' || 'false' }}

      - name: Install OVSX
        if: env.SKIP_PUBLISH != 'true'
        run: npm install -g ovsx
        env:
          SKIP_PUBLISH: ${{ secrets.OPENVSX_PAT == '' && 'true' || 'false' }}

      - name: Publish to Open VSX
        if: env.SKIP_PUBLISH != 'true'
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://open-vsx.org/api/Zheng404/ai-quota-dashboard/$VERSION")
          if [ "$STATUS" = "200" ]; then
            echo "⚠️ Version $VERSION already exists on Open VSX, skipping publish"
          else
            ovsx publish -p ${{ secrets.OPENVSX_PAT }}
          fi
        env:
          SKIP_PUBLISH: ${{ secrets.OPENVSX_PAT == '' && 'true' || 'false' }}

      - name: Push version changes to main
        run: |
          git fetch origin main
          git rebase origin/main || git rebase --abort
          git push origin HEAD:main

    outputs:
      vsix_file: ${{ steps.get_filename.outputs.VSIX_FILE }}
      version: ${{ steps.get_version.outputs.VERSION }}

  browser:
    name: Browser Extension Release
    runs-on: ubuntu-latest
    needs: vscode

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: vscode/package-lock.json

      - name: Install dependencies (esbuild)
        run: npm --prefix vscode ci

      # build.sh 以 vscode/package.json 为版本号唯一可信源，而本 job 检出的是 tag
      # 提交——若 tag 与发布版本不一致会导致资产名错配，此处按 tag 版本对齐（确定性）。
      # 仓库约定：发版准备提交中已预先 bump 版本时本步为无操作。
      - name: Sync version from tag
        run: |
          VERSION="${{ needs.vscode.outputs.version }}"
          node -e "const fs=require('fs');const p='vscode/package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));if(j.version!=='$VERSION'){j.version='$VERSION';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');console.log('Synced version to $VERSION')}else{console.log('Version already $VERSION')}"

      # 打包必须走 build.sh staging 流程（与 ci.yml 一致）：rsync 共享代码 +
      # esbuild IIFE bundle 覆盖 background.js + 改写 staging manifest version + 打 zip。
      # ⚠️ 禁止回退为手工 cp+zip 清单——v1.1.6 曾因此漏掉 shared-ui.js / protocol/，
      # 且 scripts/background.js 是未 bundle 的 ESM 源码，发布包直接不可用
      - name: Package browser extensions
        run: bash build.sh

      # 断言：IIFE bundle、protocol 共享层、shared-ui.js 必须进包
      - name: Assert packaged artifacts
        run: |
          for browser in chrome firefox; do
            zip_file="build/ai-quota-dashboard-${browser}-v$(node -p "require('./vscode/package.json').version").zip"
            echo "校验 ${zip_file}..."
            unzip -l "$zip_file" | grep -q 'scripts/background.js' \
              || { echo "FAIL: scripts/background.js 不在 ${browser} 包内"; exit 1; }
            unzip -l "$zip_file" | grep -q 'protocol/index.js' \
              || { echo "FAIL: protocol/index.js 不在 ${browser} 包内"; exit 1; }
            unzip -l "$zip_file" | grep -q 'shared-ui.js' \
              || { echo "FAIL: shared-ui.js 不在 ${browser} 包内"; exit 1; }
            echo "PASS: ${browser} 包校验通过"
          done

      - name: Upload Chrome artifact
        uses: actions/upload-artifact@v4
        with:
          name: browser-extension-chrome-release
          path: build/ai-quota-dashboard-chrome-v*.zip
          retention-days: 90

      - name: Upload Firefox artifact
        uses: actions/upload-artifact@v4
        with:
          name: browser-extension-firefox-release
          path: build/ai-quota-dashboard-firefox-v*.zip
          retention-days: 90

    outputs:
      chrome_file: ai-quota-dashboard-chrome-v${{ needs.vscode.outputs.version }}.zip
      firefox_file: ai-quota-dashboard-firefox-v${{ needs.vscode.outputs.version }}.zip

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [vscode, browser]

    steps:
      - name: Download VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: vscode-extension-release
          path: ./artifacts/

      - name: Download Chrome artifact
        uses: actions/download-artifact@v4
        with:
          name: browser-extension-chrome-release
          path: ./artifacts/

      - name: Download Firefox artifact
        uses: actions/download-artifact@v4
        with:
          name: browser-extension-firefox-release
          path: ./artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        run: |
          echo "##  Release ${{ needs.vscode.outputs.version }} Published!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### VSCode Extension" >> $GITHUB_STEP_SUMMARY
          echo "- **VSIX**: ${{ needs.vscode.outputs.vsix_file }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Browser Extensions" >> $GITHUB_STEP_SUMMARY
          echo "- **Chrome/Edge**: ${{ needs.browser.outputs.chrome_file }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Firefox**: ${{ needs.browser.outputs.firefox_file }}" >> $GITHUB_STEP_SUMMARY
