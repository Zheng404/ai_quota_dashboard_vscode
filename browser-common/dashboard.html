<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src https://*.kimi.com https://*.xiaomimimo.com https://open.bigmodel.cn http://127.0.0.1:*; style-src 'self' 'unsafe-inline';">
  <title>AI Quota Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="page">
  <div class="container">
    <header>
      <div class="brand">
        <span class="brand-mark">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
        </span>
        <div class="brand-text">
          <h1>AI QUOTA DASHBOARD</h1>
          <span class="brand-sub">Quota Observatory · 配额观测台</span>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn btn-icon" id="btn-settings" title="服务管理">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/></svg>
        </button>
        <button class="btn btn-primary" id="btn-refresh" title="刷新">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
          <span>刷新</span>
        </button>
      </div>
    </header>

    <div class="tabs">
      <div class="tab-indicator"></div>
      <button class="tab-btn active" data-tab="dashboard">仪表盘</button>
      <button class="tab-btn" data-tab="services">服务</button>
      <button class="tab-btn" data-tab="global">设置</button>
    </div>

    <div class="tab-panel active" id="panel-dashboard">
      <div id="services">
        <div class="empty-state">
          <p>加载中...</p>
        </div>
      </div>
    </div>

    <div class="tab-panel" id="panel-services"></div>
    <div class="tab-panel" id="panel-global"></div>

    <div class="footer">
      <span>AI Quota Dashboard</span>
      <span class="last-update" id="last-update"></span>
    </div>
  </div>

  <script type="module" src="dashboard.js"></script>
</body>
</html>
